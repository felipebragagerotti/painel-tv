<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex, nofollow">
<title>Painel TV</title>
<style>
  /* Palco fixo 1920x1080 (igual ao Chrome em tela cheia no PC), escalado para caber na TV */
  :root { color-scheme: light; }
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#F3F6FB; cursor:none; }
  #palco { position:absolute; left:0; top:0; width:1920px; height:1080px; transform-origin:0 0; -webkit-transform-origin:0 0; }
  iframe { position:absolute; top:0; left:0; width:1920px; height:1080px; border:0; background:#fff;
           color-scheme: light; visibility:hidden; }
  iframe.ativa { visibility:visible; }
  #barra { position:fixed; left:0; bottom:0; height:4px; width:0; background:rgba(1,28,114,.35); z-index:10; }
  #debug { position:fixed; left:10px; top:10px; z-index:20; background:#011C72; color:#fff; font:20px monospace; padding:8px 12px; }
  #aviso { font:24px sans-serif; color:#011C72; text-align:center; margin-top:40vh; }
</style>
</head>
<body>
<div id="palco"></div>
<div id="barra"></div>
<script>
  // Configuração vem no endereço, depois do "#", para não ficar nada sensível neste arquivo público:
  //   #k=CHAVE_DO_PAINEL&r=ID1,ID2,ID3,ID4
  // k = chave do painel (Apps Script) | r = códigos dos dashboards da Reportei
  var PAINEL = 'https://script.google.com/macros/s/AKfycbwrSeyEP_43PIA-GOuEhFJDOrzIAud4igc2yzEirZUiS7hUzbKeR3C9LFmQSBhusfg7/exec';
  var SEG_PAINEL = 110, SEG_REPORTEI = 25, RECARGA_REPORTEI = 900;

  var cfg = {};
  location.hash.replace(/^#/, '').split('&').forEach(function (p) {
    var i = p.indexOf('='); if (i > 0) cfg[p.slice(0, i)] = decodeURIComponent(p.slice(i + 1));
  });

  var TELAS = [];
  if (cfg.k) TELAS.push({ url: PAINEL + '?k=' + encodeURIComponent(cfg.k), segundos: SEG_PAINEL, recarregarSeg: 0, precarregar: true });
  (cfg.r || '').split(',').filter(Boolean).forEach(function (id) {
    TELAS.push({ url: 'https://app.reportei.com/dashboard/' + id, segundos: SEG_REPORTEI, recarregarSeg: RECARGA_REPORTEI });
  });

  if (!TELAS.length) {
    document.body.innerHTML = '<div id="aviso">Link incompleto. Use o link completo do Painel TV.</div>';
  } else {
    var frames = [], atual = -1;
    TELAS.forEach(function (t) {
      var f = document.createElement('iframe');
      f.src = t.url;
      f.setAttribute('allow', 'fullscreen');
      document.getElementById('palco').appendChild(f);
      frames.push({ el: f, carregadoEm: Date.now() });
    });

    function recarregarSePreciso(i) {
      var t = TELAS[i], f = frames[i];
      if (t.recarregarSeg > 0 && Date.now() - f.carregadoEm >= t.recarregarSeg * 1000) {
        f.el.src = t.url; f.carregadoEm = Date.now();
      }
    }
    function animarBarra(seg) {
      var b = document.getElementById('barra');
      b.style.transition = 'none'; b.style.width = '0'; void b.offsetWidth;
      b.style.transition = 'width ' + seg + 's linear'; b.style.width = '100%';
    }
    function proxima() {
      var anterior = atual;
      atual = (atual + 1) % TELAS.length;
      frames[atual].el.classList.add('ativa');
      if (anterior >= 0 && anterior !== atual) {
        frames[anterior].el.classList.remove('ativa');
        recarregarSePreciso(anterior);
      }
      animarBarra(TELAS[atual].segundos);
      setTimeout(proxima, TELAS[atual].segundos * 1000);
      // Recarrega o painel ~6s antes da vez dele, para ele sempre começar na Visão geral
      var prox = (atual + 1) % TELAS.length;
      if (TELAS[prox].precarregar && prox !== atual) {
        setTimeout(function () { frames[prox].el.src = TELAS[prox].url; }, Math.max(0, TELAS[atual].segundos - 6) * 1000);
      }
    }
    // Encaixa o palco 1920x1080 na tela, seja qual for o tamanho que o navegador da TV informar
    function ajustar() {
      var w = document.documentElement.clientWidth || window.innerWidth;
      var h = document.documentElement.clientHeight || window.innerHeight;
      var e = Math.min(w / 1920, h / 1080);
      var x = (w - 1920 * e) / 2, y = (h - 1080 * e) / 2;
      var t = 'translate(' + x + 'px,' + y + 'px) scale(' + e + ')';
      var p = document.getElementById('palco');
      p.style.webkitTransform = t; p.style.transform = t;
      var d = document.getElementById('debug');
      if (d) d.textContent = 'tela ' + w + 'x' + h + ' | inner ' + window.innerWidth + 'x' + window.innerHeight +
        ' | dpr ' + window.devicePixelRatio + ' | escala ' + e.toFixed(3);
    }
    if (/[?&]debug/.test(location.search)) {
      var d = document.createElement('div'); d.id = 'debug'; document.body.appendChild(d);
    }
    window.addEventListener('resize', ajustar);
    window.addEventListener('orientationchange', ajustar);
    ajustar();
    setTimeout(ajustar, 500); setTimeout(ajustar, 2000); setInterval(ajustar, 10000);
    proxima();
    // Recarrega a página inteira 1x por dia (madrugada) para liberar memória da TV
    setInterval(function () { if (new Date().getHours() === 4) location.reload(); }, 3600 * 1000);
  }
</script>
</body>
</html>
